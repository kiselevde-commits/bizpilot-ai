# Docker Desktop / WSL2 resource limits (BizPilot AI, 8 GB RAM host).
# Apply via %USERPROFILE%\.wslconfig then `wsl --shutdown`.

[wsl2]
memory=4GB
processors=2
swap=2GB
localhostForwarding=true

# Hints for Docker Desktop settings (GUI):
# - Resources -> Advanced: Memory 4 GB, Processors 2, Swap 2 GB
# - WSL Integration: enable your distro only
# - General: "Use WSL 2 based engine" enabled
