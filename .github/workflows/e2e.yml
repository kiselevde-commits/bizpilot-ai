name: E2E

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.20.0"
  PNPM_VERSION: "9.15.9"
  CI: "true"
  DATABASE_URL: "postgresql://bizpilot:bizpilot_ci_password@localhost:5432/bizpilot_e2e_test?schema=public"
  TEST_DATABASE_URL: "postgresql://bizpilot:bizpilot_ci_password@localhost:5432/bizpilot_e2e_test?schema=public"
  SHADOW_DATABASE_URL: "postgresql://bizpilot:bizpilot_ci_password@localhost:5432/bizpilot_e2e_test_shadow?schema=public"
  AUTH_SECRET: "ci_only_auth_secret_at_least_32_chars"
  AUTH_URL: "http://localhost:3000"
  AUTH_TRUST_HOST: "true"
  APP_BASE_URL: "http://localhost:3000"
  SEED_ADMIN_PASSWORD: "ci_only_seed_password"
  # Mock AI only: CI must never call a paid LLM.
  AI_PROVIDER: "mock"
  ALLOW_MOCK_AI: "true"
  AI_TIMEOUT_MS: "60000"
  N8N_WEBHOOK_URL: ""
  N8N_WEBHOOK_SECRET: ""
  N8N_CALLBACK_SECRET: ""
  N8N_TIMEOUT_MS: "10000"
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""

jobs:
  playwright:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    # POSTGRES_PASSWORD for this ephemeral service container is intentionally
    # static: GitHub Actions' `jobs.<job>.services` schema does not support
    # runtime shell generation in the service declaration, and the password
    # stays inside the isolated, throwaway runner container.
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: bizpilot
          POSTGRES_PASSWORD: bizpilot_ci_password
          POSTGRES_DB: bizpilot_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bizpilot -d bizpilot_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Apply migrations
        run: pnpm exec prisma migrate deploy
      - name: Seed demo data
        run: pnpm exec prisma db seed
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E scenarios
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
