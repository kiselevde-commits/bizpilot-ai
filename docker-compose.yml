services:
  postgres:
    image: postgres:16.16-alpine
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 512m
    memswap_limit: 1024m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bizpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizpilot -d bizpilot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && echo 'migrate done'"]

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      APP_BASE_URL: http://localhost:3000
      AI_PROVIDER: mock
      ALLOW_MOCK_AI: "true"
      AI_TIMEOUT_MS: "60000"
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 1024m
    memswap_limit: 2048m
    shm_size: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/ai/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  bizpilot_pgdata:
